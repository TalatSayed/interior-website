<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: "Inter", sans-serif;
            background-color: #f5f2ef;
        }

        h1 {
            text-align: center;
            margin: 40px 0;
        }

        /* ===== GALLERY GRID ===== */
        .gallery {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-auto-rows: 250px;
            gap: 15px;
            padding: 20px;

            /* ⭐ IMPORTANT FIX */
            grid-auto-flow: dense;
        }

        .item {
            overflow: hidden;
            border-radius: 10px;
        }

        .item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: 0.4s ease;
        }

        /* Hover zoom effect */
        .item:hover img {
            transform: scale(1.1);
        }

        /* Grid sizes */
        .wide {
            grid-column: span 2;
        }

        .tall {
            grid-row: span 2;
        }

        .big {
            grid-column: span 2;
            grid-row: span 2;
        }

        /* ===== RESPONSIVE ===== */

        /* Tablet */
        @media (max-width: 900px) {
            .gallery {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* Mobile */
        @media (max-width: 500px) {
            .gallery {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <h1>Our Interior Gallery</h1>
    <nav class="navbar navbar-expand-lg navbar-light bg-white fixed-top py-3 shadow-sm" id="mainNav">
        <div class="container">

                Luxury Living Interiors
            </a>

            <!-- Mobile Toggle -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarResponsive"
                aria-controls="navbarResponsive" aria-expanded="false" aria-label="Toggle navigation">

                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Menu -->
            <div class="collapse navbar-collapse" id="navbarResponsive">
                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link active" href="pricingpage.html">Pricing</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="index.html#about">About</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="index.html#services">Services</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="index.html#contact">Contact</a>
                    <li class="nav-item"><a class="nav-link" href="testemonial.html">Testimonials</a></li>
                    </li>

                </ul>
            </div>

        </div>
    </nav>

    <div class="gallery">

        <div class="item big">
            <img src="assets/images/img1.jpg" alt="Interior Design 1">
        </div>

        <div class="item">
            <img src="assets/images/img2.jpg" alt="Interior Design 2">
        </div>

        <div class="item tall">
            <img src="assets/images/img3.jpg" alt="Interior Design 3">
        </div>

        <div class="item wide">
            <img src="assets/images/img4.jpg" alt="Interior Design 4">
        </div>
        <div class="item">

    </div>

</body>

</html>
